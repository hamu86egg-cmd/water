<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>水をぎりぎりまで注ぐだけ</title>
<style>
html,body{margin:0;height:100%;background:#e9e2d6;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#2b2520;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,32,24,.55);z-index:5}
.box{width:min(440px,92vw);max-height:94vh;overflow:auto;background:#fbf7f0;border-radius:20px;padding:20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{margin:0;font-size:24px}
.lead{color:#7a6d60;font-size:13px;margin:6px 0 14px}
.item{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:14px;background:#fff;margin-bottom:10px;cursor:pointer;border:2px solid #eee3d3}
.item:hover{border-color:#d9a441}
.item .e{font-size:38px;width:52px;text-align:center}
.item .n{font-weight:900;font-size:17px}
.item .d{font-size:12px;color:#7a6d60;margin-top:2px}
.item .b{font-size:11px;color:#b07d1a;font-weight:700;margin-top:3px}
button{font:800 15px system-ui,sans-serif;color:#fff;background:#2b2520;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;margin:4px}
button.l{background:#efe6d8;color:#2b2520}
#act{position:fixed;left:50%;bottom:13.5%;transform:translateX(-50%);display:none;background:#5a2d0f;color:#fff;font-size:16px;padding:12px 24px;z-index:3;box-shadow:0 4px 0 #2b1405}
#done{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);display:none;background:#d9a441;color:#2b2520;font-size:17px;padding:14px 28px;z-index:3;box-shadow:0 4px 0 #9b7120}
.grade{display:inline-block;font-size:44px;font-weight:900;width:84px;height:84px;line-height:84px;border-radius:50%;background:#2b2520;color:#fff;margin:6px 0}
.grade.legend{background:linear-gradient(135deg,#f7d774,#d9a441,#fff1b8,#c98a1a);color:#2b2520;font-size:22px}
.score{font-size:40px;font-weight:900;margin:4px 0}
.cmt{color:#7a6d60;margin-bottom:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="act">タレを入れる</button>
<button id="done">これで完成！</button>
<div class="ov" id="menu"><div class="box">
  <h1>〜するだけ</h1>
  <div class="lead">日常のひと手間を、極める。</div>
  <div id="list"></div>
</div></div>
<div class="ov" id="res"><div class="box">
  <div id="rName" style="font-weight:800;color:#7a6d60"></div>
  <div class="grade" id="rGrade"></div>
  <div class="score" id="rScore"></div>
  <div class="cmt" id="rCmt" style="white-space:pre-line"></div>
  <button id="again">もう1回</button><button id="copy" class="l">📋 結果をコピー</button><button id="back" class="l" style="display:none">一覧へ</button>
  <div id="copied" style="font-size:12px;color:#7a6d60;margin-top:6px"></div>
</div></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k;
const VW=420,VH=740;let Z=1,OX=0,OY=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);Z=Math.min(innerWidth/VW,innerHeight/VH);OX=(innerWidth/Z-VW)/2;OY=(innerHeight/Z-VH)/2;cv.width=innerWidth*DPR|0;cv.height=innerHeight*DPR|0;}
addEventListener('resize',resize);resize();

// ===== 音 =====
let AC=null;const lastS={};
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f1,f2,dur,type,vol,key,gap){if(!AC)return;const n=performance.now();if(key){if(n-(lastS[key]||0)<(gap||40))return;lastS[key]=n;}
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function noise(dur,vol,freq,key,gap){if(!AC)return;const n=performance.now();if(key){if(n-(lastS[key]||0)<(gap||40))return;lastS[key]=n;}
  try{const len=AC.sampleRate*dur|0,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2000;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}

// ===== 入力 =====
const P={down:false,x:0,y:0,px:0,py:0,vx:0,vy:0,downT:0};
function toL(e){return [e.clientX/Z-OX,e.clientY/Z-OY];}
cv.addEventListener('pointerdown',e=>{initAudio();e.preventDefault();[P.x,P.y]=toL(e);P.px=P.x;P.py=P.y;P.down=true;P.downT=0;if(G&&state==='play'&&G.down)G.down(P.x,P.y);});
addEventListener('pointermove',e=>{[P.x,P.y]=toL(e);});
addEventListener('pointerup',()=>{if(P.down&&G&&state==='play'&&G.up)G.up();P.down=false;});

// ---- フィルム粒子（AIっぽい“つるつる感”を消す） ----
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const o=c.getContext('2d');const im=o.createImageData(160,160);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}o.putImageData(im,0,0);return c;})();
function drawGrain(a){ctx.save();ctx.globalAlpha=a;ctx.globalCompositeOperation='overlay';const ox=Math.random()*160|0,oy=Math.random()*160|0;for(let x=-OX-ox;x<VW+OX;x+=160)for(let y=-OY-oy;y<VH+OY;y+=160)ctx.drawImage(GRAIN,x,y);ctx.restore();}
function vignette(a){const g=ctx.createRadialGradient(VW*.42,VH*.4,VH*.25,VW/2,VH/2,VH*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(20,12,5,${a})`);ctx.fillStyle=g;ctx.fillRect(-OX,-OY,VW+OX*2,VH+OY*2);}
function srand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// ===== 共通描画 =====
function table(c1,c2){const g=ctx.createLinearGradient(0,-OY,0,VH+OY);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(-OX,-OY,VW+OX*2,VH+OY*2);}
function label(t,y,size,col){ctx.textAlign='center';ctx.font=`800 ${size||16}px system-ui`;ctx.fillStyle=col||'#2b2520';ctx.fillText(t,VW/2,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// =========================================================
// 2. 水をぎりぎりまで注ぐだけ（v0.4：リアル描画＋コイン）
// =========================================================
const WATER={
  name:'水をぎりぎりまで注ぐだけ',emoji:'🥛',desc:'コップに水を注いで、最後はコインを1枚ずつ。表面張力でどこまで盛り上がる？ 1滴でもこぼれたら終わり。',
  init(){
    this.cx=210;this.top=300;this.bot=622;this.rT=74;this.rB=60;this.base=20;
    this.lv=0;this.rate=0;this.limit=rnd(6.5,12.5);this.wob=0;this.spill=false;this.ended=false;this.t=0;
    this.phase='pour';this.coins=[];this.held=null;this.nCoin=0;this.drops=[];this.rings=[];this.bubs=[];this.lastEntry=null;this.sheet=0;this.puddle=0;
    if(!this.bg)this.bg=this.makeBg();
    actBtn('注ぎ終わり → コインへ',()=>this.toCoin());hideAct();doneBtn('これで完成！',()=>this.done());
  },
  // ---- 背景（壁・窓明かり・大理石カウンター）を一度だけ描く ----
  makeBg(){
    // 1) 奥（ピントの外）：小さく描いて引き伸ばす＝自然なボケ
    const sw=VW/5|0,shh=VH/5|0,lo=document.createElement('canvas');lo.width=sw;lo.height=shh;const l=lo.getContext('2d');l.scale(1/5,1/5);const R=srand(11);
    let g=l.createLinearGradient(0,0,VW,0);g.addColorStop(0,'#efe9df');g.addColorStop(1,'#bfc0bb');l.fillStyle=g;l.fillRect(0,0,VW,640);
    for(let y=0;y<640;y+=34)for(let x=-(y/34%2)*44;x<VW;x+=88){const v=R()*14-7;l.fillStyle=`rgb(${226+v},${224+v},${216+v})`;l.fillRect(x+2,y+2,84,30);}
    // 左の窓（強い光源）
    g=l.createLinearGradient(0,60,0,420);g.addColorStop(0,'#fffaf0');g.addColorStop(1,'#f3efe4');l.fillStyle=g;l.fillRect(-20,40,120,420);l.fillStyle='#d8d2c4';l.fillRect(42,40,8,420);l.fillRect(-20,240,120,7);
    l.fillStyle='rgba(120,150,95,.55)';l.beginPath();l.ellipse(20,380,60,50,0,0,TAU);l.fill();
    // 奥の物：洗剤ボトル・スポンジ・マグ・水切りかご
    l.fillStyle='#7fa86a';l.fillRect(282,470,44,150);l.beginPath();l.ellipse(304,470,22,10,0,0,TAU);l.fill();l.fillStyle='#e9e4d8';l.fillRect(292,440,22,32);l.fillStyle='rgba(255,255,255,.5)';l.fillRect(288,490,8,110);
    l.fillStyle='#d9b84a';l.fillRect(120,592,64,28);l.fillStyle='#4f7b4a';l.fillRect(120,612,64,8);
    l.fillStyle='#9c4b3c';l.fillRect(352,540,52,80);l.fillStyle='#7a372b';l.fillRect(400,560,14,36);
    l.strokeStyle='#9aa0a3';l.lineWidth=3;for(let x=-10;x<90;x+=14){l.beginPath();l.moveTo(x,520);l.lineTo(x,620);l.stroke();}
    // 光の向き：左が明るく右が暗い
    g=l.createLinearGradient(0,0,VW,0);g.addColorStop(0,'rgba(255,245,225,.25)');g.addColorStop(1,'rgba(40,40,45,.22)');l.fillStyle=g;l.fillRect(0,0,VW,640);
    // 2) 手前（ピントが合う）：カウンター
    const S=2,oc=document.createElement('canvas');oc.width=VW*S;oc.height=VH*S;const o=oc.getContext('2d');o.scale(S,S);o.imageSmoothingQuality='high';
    {const md=document.createElement('canvas');md.width=VW/2;md.height=VH/2;const m=md.getContext('2d');m.imageSmoothingQuality='high';m.drawImage(lo,0,0,VW/2,VH/2);
      const md2=document.createElement('canvas');md2.width=VW;md2.height=VH;const m2=md2.getContext('2d');m2.imageSmoothingQuality='high';
      for(const [dx,dy] of [[0,0],[1.5,0],[-1.5,0],[0,1.5],[0,-1.5]]){m2.globalAlpha=dx||dy?.2:1;m2.drawImage(md,dx,dy,VW,VH);}
      o.drawImage(md2,0,0,VW,VH);}
    g=o.createLinearGradient(0,618,0,VH);g.addColorStop(0,'#d9d6cf');g.addColorStop(1,'#bdb9b0');o.fillStyle=g;o.fillRect(0,618,VW,VH-618);
    for(let i=0;i<5000;i++){const v=R();o.fillStyle=v<.5?`rgba(255,255,255,${R()*.35})`:`rgba(70,65,58,${R()*.25})`;o.fillRect(R()*VW,618+R()*(VH-618),.8+R(),.8+R());}
    o.strokeStyle='rgba(255,255,255,.25)';o.lineWidth=.6;for(let i=0;i<14;i++){const x=R()*VW,y=622+R()*110;o.beginPath();o.moveTo(x,y);o.lineTo(x+rnd(-40,40),y+rnd(-3,3));o.stroke();}
    g=o.createLinearGradient(0,612,0,626);g.addColorStop(0,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,0)');o.fillStyle=g;o.fillRect(0,612,VW,14);
    g=o.createLinearGradient(0,0,VW,0);g.addColorStop(0,'rgba(255,248,230,.18)');g.addColorStop(1,'rgba(0,0,0,.12)');o.fillStyle=g;o.fillRect(0,618,VW,VH-618);
    // ガラスの汚れ（水滴・指紋）を固定で用意
    this.spots=[...Array(46)].map(()=>({x:rnd(-.95,.95),y:rnd(.02,.98),r:rnd(.4,1.8),a:rnd(.15,.5)}));
    this.smudge={x:rnd(-.5,-.1),y:rnd(.55,.8)};
    return oc;
  },
  rAt(y){const k=clamp((y-this.top)/(this.bot-this.top),0,1);return lerp(this.rT,this.rB,k);},
  innerBot(){return this.bot-this.base;},
  surfY(){return this.innerBot()-this.lv;},
  over(){return this.lv-(this.innerBot()-this.top);},
  toCoin(){if(this.phase!=='pour')return;this.phase='coin';hideAct();this.rate=0;this.newCoin();tone(800,1000,.1,'triangle',.06);},
  newCoin(){this.held={t:0,spd:rnd(2.4,3.4)};},
  theta(){return this.held?1.2*Math.sin(this.held.t*this.held.spd):0;},
  down(){
    if(this.phase==='coin'&&this.held&&!this.ended){
      const th=this.theta(),py=this.top-120;
      this.coins.push({x:this.cx+Math.sin(th)*22,y:py+Math.cos(th)*22,vy:0,th,phi:0,vphi:0,inW:false,rest:false,sway:rnd(0,TAU),bx:0,by:0});
      this.held=null;setTimeout(()=>{if(!this.ended)this.newCoin();},500);tone(2200,2000,.02,'square',.03);
    }
  },
  update(dt){
    this.t+=dt;if(this.held)this.held.t+=dt;
    for(const r of this.rings)r.t+=dt;this.rings=this.rings.filter(r=>r.t<1.2);
    for(const d of this.drops){d.vy+=1200*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.l-=dt;}this.drops=this.drops.filter(d=>d.l>0);
    for(const b of this.bubs){b.y-=b.v*dt;b.x+=Math.sin(this.t*6+b.p)*8*dt;}this.bubs=this.bubs.filter(b=>b.y>this.surfY()+2);
    if(this.lastEntry){this.lastEntry.t-=dt;if(this.lastEntry.t<=0)this.lastEntry=null;}
    if(this.spill){this.sheet=Math.min(1,this.sheet+dt*2);this.puddle=Math.min(1,this.puddle+dt*.8);}
    if(this.ended&&!this.spill)return;
    const sy=this.surfY();
    if(this.phase==='pour'){
      if(P.down&&!this.ended)this.rate=Math.min(110,this.rate+dt*130);else this.rate=Math.max(0,this.rate-dt*300);
      if(this.rate>0){
        this.lv+=this.rate*dt*.5;this.wob=Math.max(this.wob,this.rate*.035);
        if(!this.ended)noise(.05,.04+this.rate/1600,600+this.lv,'w',55);
        if(Math.random()<this.rate*dt*.25)this.rings.push({t:0,x:this.cx+rnd(-4,4)});
        const n=this.rate*dt*.6;for(let i=0;i<n;i++)if(Math.random()<.8)this.bubs.push({x:this.cx+rnd(-10,10),y:sy+rnd(10,10+this.rate*.9),v:rnd(40,110),r:rnd(.8,2.6),p:rnd(0,TAU)});
        if(Math.random()<this.rate*dt*.3)this.drops.push({x:this.cx+rnd(-6,6),y:sy-2,vx:rnd(-60,60),vy:rnd(-160,-60),l:.5,r:rnd(1,2)});
      }
      if(this.over()>-9)showAct();
    }
    for(const c of this.coins){
      if(c.rest)continue;
      if(!c.inW){c.vy+=1500*dt;c.y+=c.vy*dt;
        if(c.y>=this.surfY()-4){c.inW=true;c.vy*=.18;const a=Math.abs(c.th);let wv,q;
          if(a<.22){wv=.4;q='スッ…（きれいに入った）';tone(1400,900,.07,'sine',.05);this.rings.push({t:0,x:c.x});}
          else if(a<.7){wv=1.8;q='ちゃぷっ';noise(.06,.09,2600);this.rings.push({t:0,x:c.x},{t:-.08,x:c.x});for(let i=0;i<4;i++)this.drops.push({x:c.x,y:this.surfY(),vx:rnd(-70,70),vy:rnd(-200,-90),l:.6,r:rnd(1,2)});}
          else{wv=3.8;q='バシャッ！';noise(.14,.2,1700);for(let k=0;k<3;k++)this.rings.push({t:-k*.07,x:c.x});for(let i=0;i<14;i++)this.drops.push({x:c.x+rnd(-6,6),y:this.surfY(),vx:rnd(-120,120),vy:rnd(-300,-110),l:.7,r:rnd(1.2,2.6)});}
          this.wob=Math.max(this.wob,wv);this.lv+=.62;this.nCoin++;this.lastEntry={s:q,t:1.1,bad:a>=.22};
          for(let i=0;i<5;i++)this.bubs.push({x:c.x+rnd(-6,6),y:this.surfY()+rnd(4,20),v:rnd(30,70),r:rnd(.8,2),p:rnd(0,TAU)});
          c.vphi=rnd(2,5)*(Math.random()<.5?-1:1);}
      }else{
        c.vy=Math.min(c.vy+260*dt,95);c.y+=c.vy*dt;c.sway+=dt*3;c.x+=Math.sin(c.sway)*28*dt;c.th*=Math.pow(.2,dt);c.phi+=c.vphi*dt;c.vphi*=Math.pow(.6,dt);
        const n=this.coins.filter(o=>o.rest).length,floor=this.innerBot()-3-Math.min(n,30)*.9;
        if(c.y>=floor){c.y=floor;c.rest=true;const a=rnd(0,TAU),r=Math.sqrt(Math.random())*(this.rB-22);c.bx=this.cx+Math.cos(a)*r;c.by=floor+Math.sin(a)*r*.22;tone(2600,2400,.03,'triangle',.03);}
      }
    }
    this.wob=Math.max(0,this.wob-dt*2.2);
    const ov=this.over();
    if(!this.spill&&ov+this.wob*Math.abs(Math.sin(this.t*9))>this.limit){
      this.spill=true;this.ended=true;hideAct();hideDone();noise(.6,.25,500);tone(400,120,.4,'sawtooth',.06);
      for(let i=0;i<24;i++)this.drops.push({x:this.cx+(Math.random()<.5?-1:1)*this.rT,y:this.top,vx:rnd(-80,80),vy:rnd(-120,40),l:1,r:rnd(1.2,2.8)});
      setTimeout(()=>this.result(),1500);
    }
    if(this.spill)this.lv=Math.max(this.lv-dt*6,(this.innerBot()-this.top)+this.limit*.35);
  },
  done(){if(this.ended)return;this.ended=true;hideAct();hideDone();tone(700,1000,.15,'triangle',.08);setTimeout(()=>this.result(),500);},
  result(){
    const over=this.over()/3,lim=this.limit/3;let g,cm,sc;
    if(this.spill){g='×';sc='こぼれた';cm=`コイン ${this.nCoin}枚目でアウト。限界は +${lim.toFixed(2)}mm だった…`;}
    else if(over<0){g='C';sc=`${over.toFixed(2)} mm`;cm='まだ入る！ 攻めが足りない';}
    else{const k=over/lim;sc=`+${over.toFixed(2)} mm`;
      if(k>=.95){g='幻';cm='表面張力の極み。息が止まる';}else if(k>=.82){g='S';cm='ぎりぎりの美学';}else if(k>=.6){g='A';cm='いい盛り上がり';}else if(k>=.3){g='B';cm='ふちは越えた';}else{g='C';cm='ふちぴったり';}
      cm+=`\nコイン ${this.nCoin}枚／限界まであと ${(lim-over).toFixed(2)}mm`;}
    showResult(g,sc,cm,this.spill?`コイン${this.nCoin}枚目でこぼした`:`ふちから${sc}（コイン${this.nCoin}枚）`);
  },
  // ---- コイン（真上から見た面） ----
  coinFace(r){
    ctx.save();
    let g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#e8e7e1');g.addColorStop(.45,'#a9aaa5');g.addColorStop(.7,'#80827e');g.addColorStop(1,'#c9c9c3');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(60,62,60,.45)';ctx.lineWidth=r*.06;ctx.beginPath();ctx.arc(0,0,r*.86,0,TAU);ctx.stroke();
    g=ctx.createRadialGradient(-r*.35,-r*.4,1,0,0,r*.85);g.addColorStop(0,'#d7d7d0');g.addColorStop(1,'#8f918c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.82,0,TAU);ctx.fill();
    // 浮き彫り（葉の模様と数字）

// ===== 画面ボタン =====
let actFn=null,doneFn=null;

function hideAct(){$('act').style.display='none';}
function hideDone(){$('done').style.display='none';}
// ===== 進行 =====

  $('rScore').textContent=score;$('rCmt').textContent=cmt;$('copied').textContent='';
  shareTxt=`『${G.name}』${G.emoji}\n${share}（${g==='幻'?'幻':'ランク'+g}）\n#〜するだけ`;
  if(g==='幻'){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,f,.25,'triangle',.08),i*90));}
  $('res').style.display='flex';
}
function start(i){gi=i;G=GAMES[i];state='play';actFn=doneFn=null;$('menu').style.display='none';$('res').style.display='none';hideDone();hideAct();G.init();}
function menu(){
  state='menu';G=null;$('res').style.display='none';hideDone();hideAct();
  const l=$('list');l.innerHTML='';
  GAMES.forEach((g,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="e">${g.emoji}</div><div><div class="n">${g.name}</div><div class="d">${g.desc}</div>${best['g'+i]?`<div class="b">自己ベスト：${best['g'+i]==='幻'?'幻':'ランク'+best['g'+i]}</div>`:''}</div>`;d.addEventListener('click',()=>{initAudio();start(i);});l.appendChild(d);});
  $('menu').style.display='flex';
}
$('again').addEventListener('click',()=>{initAudio();start(gi);});
$('back').addEventListener('click',menu);
for(const id of['done','act'])$(id).addEventListener('pointerdown',e=>e.stopPropagation());
$('done').addEventListener('click',()=>{if(doneFn&&state==='play')doneFn();});
$('act').addEventListener('click',()=>{if(actFn&&state==='play')actFn();});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(shareTxt);$('copied').textContent='コピーしました';}catch(e){$('copied').textContent='コピーできませんでした';}});

let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,Math.max(0,(now-last)/1000));last=now;
  if(G&&(state==='play'||state==='res'))G.update(dt);
  P.px=P.x;P.py=P.y;
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*Z*OX,DPR*Z*OY);
  if(G)G.draw();else table('#efe6d8','#d9cbb4');
  requestAnimationFrame(frame);
}
start(0);requestAnimationFrame(frame);
})();
</script>
